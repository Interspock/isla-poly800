name: build

on:
  push:
  pull_request:

jobs:
  linux-lv2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config lv2-dev lilv-utils

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --verbose

      - name: Test DSP and LV2 state
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark DSP core
        run: ./build/core_bench

      - name: Check LV2 bundle and discovery
        run: |
          test -f build/isla-poly800.lv2/isla-poly800.so
          test -f build/isla-poly800.lv2/manifest.ttl
          test -f build/isla-poly800.lv2/isla-poly800.ttl
          test -f build/isla-poly800.lv2/state.ttl
          test -f build/isla-poly800.lv2/presets.ttl
          test "$(grep -c 'a pset:Preset' build/isla-poly800.lv2/presets.ttl)" -eq 2
          rm -rf /tmp/isla-lv2path
          mkdir -p /tmp/isla-lv2path
          cp -a build/isla-poly800.lv2 /tmp/isla-lv2path/
          LV2_PATH=/tmp/isla-lv2path lv2info https://interspock.github.io/isla-poly800 | tee /tmp/isla-lv2info.txt
          grep -q 'state#interface' /tmp/isla-lv2info.txt
          grep -q 'Init Whole' /tmp/isla-lv2info.txt
          grep -q 'Double Fifth Test' /tmp/isla-lv2info.txt
          find build/isla-poly800.lv2 -maxdepth 1 -type f -print
